name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: turmite
          POSTGRES_PASSWORD: turmite
          POSTGRES_DB: turmite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turmite" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Server for tests/common: each test makes its own database there.
      TURMITE_TEST_PG: postgres://turmite:turmite@localhost:5432
      # Real-chain tests run only when TURMITE_TEST_CHAINS names their chain (or is `all`)
      # and the deploy/testnets nodes are up. CI leaves it unset, so they skip.
      # Locally: TURMITE_TEST_CHAINS=all scripts/e2e.sh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  contracts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - run: forge build
      - run: forge test
      # The server embeds out-min/DepositFactory.json: it must match the sources.
      - run: sh script/export-min.sh && git diff --exit-code out-min

  sdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  plugin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugins/woocommerce
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: none
          coverage: none
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/signature-test.php

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  image:
    # The release builds both architectures; this checks the Dockerfile on main.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: turmite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm turmite:ci version
