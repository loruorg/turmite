name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Docker Hub is the public image. The same build also goes to GitHub Packages.
  IMAGE: loruorg/turmite
  GHCR_IMAGE: ghcr.io/loruorg/turmite

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Tag must match the crate version
        run: |
          tag=${GITHUB_REF_NAME#v}
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/turmite/Cargo.toml | head -n 1)
          if [ "$tag" != "$crate" ]; then
            echo "tag $GITHUB_REF_NAME does not match crates/turmite version $crate" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case $tag in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
      # The Dockerfile cross-compiles, so arm64 needs no emulation.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  plugin:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: plugins/woocommerce/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: plugins/woocommerce/dist/turmite-woocommerce.zip

  sdk:
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm pack --pack-destination dist-pack
      - uses: actions/upload-artifact@v7
        with:
          name: sdk
          path: sdk/typescript/dist-pack/*.tgz

  release:
    needs: [version, image, plugin, sdk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Notes
        run: |
          v=${{ needs.version.outputs.version }}
          cat > notes.md <<EOF
          Image: \`${IMAGE}:$v\` (linux/amd64, linux/arm64)

          Install: \`curl -fsSL https://turmite.com/install.sh | sudo sh -s -- --version $v --site-url https://pay.example.com\`

          Upgrade: \`curl -fsSL https://turmite.com/install.sh | sudo sh -s -- --upgrade --version $v\`
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          name: Turmite ${{ needs.version.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: |
            assets/turmite-woocommerce.zip
            assets/*.tgz
