openapi: 3.1.0
info:
  title: Turmite merchant API
  version: "1"
  license:
    name: MIT
    identifier: MIT
  description: |
    The merchant API of a Turmite install. Your shop or backend calls it.

    The base URL is the site URL of the install. The site URL can have a path, for example
    `https://example.com/pay`. Then the API is at `https://example.com/pay/v1/...`.

    Send the project API key in the `x-api-key` header. Keys start with `tm_`. The payout endpoints that move
    funds also need a bearer token from `POST /v1/auth`.

    Requests and responses are JSON. Request amounts can be a JSON number or a decimal string. Payment amounts
    in responses are JSON numbers. A whole amount is an integer, such as `100`. Invoice and payout amounts in
    responses are decimal strings.

    `payment_id` is a string in the responses that create a payment. It is a number in the other responses
    and in webhooks.

    An error has a non-2xx status and a body with `status`, `statusCode`, `code` and `message`. Treat `code`
    as an open set of values. Each endpoint can return `429` when one IP address sends too many requests.

    The API keeps the paths, fields and IPN signature of the common hosted-gateway API shape. To move an
    existing integration, change the base URL, the API key and, if necessary, the signature header name.
servers:
  - url: https://{host}{basePath}
    description: Your Turmite install
    variables:
      host:
        default: pay.example.com
        description: The host of the site URL, or a checkout domain of the project.
      basePath:
        default: ""
        description: The path of the site URL, such as `/pay`. Empty when Turmite has the whole host.
security:
  - apiKey: []
tags:
  - name: Payments
    description: Create payments and read their status.
  - name: Invoices
    description: Hosted invoices. The customer selects the coin on the invoice page.
  - name: Payouts
    description: Send funds from the project's hot wallets.
  - name: Reference
    description: Currencies, minimum amounts, estimates and balances.
  - name: Auth
    description: Bearer tokens for the payout endpoints.

paths:
  /v1/status:
    get:
      tags: [Reference]
      operationId: getStatus
      summary: Check that the API is up
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    const: OK
              example: { message: OK }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/currencies:
    get:
      tags: [Reference]
      operationId: getCurrencies
      summary: List enabled tickers
      description: With a key, the tickers enabled for the key's project. Without a key, the tickers that at least one project takes.
      security:
        - apiKey: []
        - {}
      responses:
        "200":
          description: Enabled tickers.
          content:
            application/json:
              schema:
                type: object
                required: [currencies]
                properties:
                  currencies:
                    type: array
                    items: { type: string }
              example: { currencies: [btc, eth, usdttrc20, sol] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/full-currencies:
    get:
      tags: [Reference]
      operationId: getFullCurrencies
      summary: List currencies with details
      description: One entry for each ticker that the server has turned on. `enable` tells if the project takes it.
      security:
        - apiKey: []
        - {}
      responses:
        "200":
          description: One entry per ticker.
          content:
            application/json:
              schema:
                type: object
                required: [currencies]
                properties:
                  currencies:
                    type: array
                    items: { $ref: "#/components/schemas/FullCurrency" }
              example:
                currencies:
                  - id: 7
                    code: USDTTRC20
                    name: Tether USD
                    enable: true
                    wallet_regex: null
                    priority: 7
                    extra_id_exists: false
                    extra_id_regex: null
                    logo_url: null
                    track: false
                    cg_id: tether
                    is_maxlimit: false
                    network: tron
                    smart_contract: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
                    network_precision: "6"
                    ticker: usdttrc20
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/merchant/coins:
    get:
      tags: [Reference]
      operationId: getMerchantCoins
      summary: List the tickers enabled for the project
      responses:
        "200":
          description: Tickers enabled for the key's project.
          content:
            application/json:
              schema:
                type: object
                required: [selectedCurrencies]
                properties:
                  selectedCurrencies:
                    type: array
                    items: { type: string }
              example: { selectedCurrencies: [btc, usdttrc20] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/min-amount:
    get:
      tags: [Reference]
      operationId: getMinAmount
      summary: Get the minimum payment amount
      description: No API key is necessary. Turmite ignores a key that you send.
      security: []
      parameters:
        - name: currency_from
          in: query
          required: true
          description: The ticker the customer pays with.
          schema: { type: string }
          example: btc
        - name: currency_to
          in: query
          required: false
          description: Turmite does not convert. It copies this value to the response. The default is `currency_from`.
          schema: { type: string }
          example: btc
        - name: fiat_equivalent
          in: query
          required: false
          description: A fiat code. When set and a rate is available, the response has `fiat_equivalent`.
          schema: { type: string }
          example: usd
      responses:
        "200":
          description: The minimum payment amount in `currency_from`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MinAmountResponse" }
              example:
                currency_from: btc
                currency_to: btc
                min_amount: 0.00001
                fiat_equivalent: 1.07
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/estimate:
    get:
      tags: [Reference]
      operationId: getEstimate
      summary: Estimate a price in a coin
      description: No API key is necessary. Turmite ignores a key that you send.
      security: []
      parameters:
        - name: amount
          in: query
          required: true
          description: The amount in `currency_from`.
          schema: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
          example: "100"
        - name: currency_from
          in: query
          required: true
          description: The price currency, such as `usd`.
          schema: { type: string }
          example: usd
        - name: currency_to
          in: query
          required: true
          description: The ticker the customer pays with.
          schema: { type: string }
          example: btc
      responses:
        "200":
          description: The estimate at the current rate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstimateResponse" }
              example:
                currency_from: usd
                amount_from: 100
                currency_to: btc
                estimated_amount: "0.00107"
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/payment:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Create a payment
      description: |
        Reserves a deposit address and fixes the amount to pay in `pay_currency`. Send the customer to your own
        page with `pay_address` and `pay_amount`, or use an invoice for the hosted checkout. A retry with the same
        `idempotency_key` returns the first payment. In this response `payment_id` and `purchase_id` are strings.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: The same as `idempotency_key` in the body. The body field has priority.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
            example:
              price_amount: 100
              price_currency: usd
              pay_currency: btc
              order_id: "1042"
              order_description: "Order #1042"
              ipn_callback_url: https://shop.example.com/turmite/ipn
              idempotency_key: order-1042
      responses:
        "201":
          description: The new payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedPayment" }
              examples:
                payment: { $ref: "#/components/examples/CreatedPayment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List payments
      parameters:
        - name: limit
          in: query
          description: Payments per page. Turmite changes a value below 1 to 1 and a value above 500 to 500.
          schema: { type: integer, minimum: 1, maximum: 500, default: 10 }
        - name: page
          in: query
          description: Page number. The first page is 0.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: sortBy
          in: query
          schema:
            type: string
            default: created_at
            enum:
              - payment_id
              - payment_status
              - pay_address
              - price_amount
              - price_currency
              - pay_amount
              - actually_paid
              - pay_currency
              - order_id
              - order_description
              - purchase_id
              - outcome_amount
              - outcome_currency
              - created_at
              - updated_at
        - name: orderBy
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: dateFrom
          in: query
          description: Earliest `created_at`. A date or a date-time.
          schema: { type: string }
          example: "2026-10-01"
        - name: dateTo
          in: query
          description: Latest `created_at`. A date or a date-time.
          schema: { type: string }
          example: "2026-10-31T23:59:59Z"
        - name: invoiceId
          in: query
          description: Only the payments of this invoice.
          schema: { type: integer, format: int64 }
          example: 4522625843
        - name: payment_status
          in: query
          description: Only the payments with this status.
          schema: { $ref: "#/components/schemas/PaymentStatus" }
        - name: order_id
          in: query
          description: Only the payments with this `order_id`.
          schema: { type: string }
      responses:
        "200":
          description: One page of payments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/payment/{payment_id}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Get a payment
      description: Ship the order only when `payment_status` is `finished`. Use webhooks instead of frequent polls.
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
          example: 5077125051
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
              examples:
                payment: { $ref: "#/components/examples/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoice:
    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Create an invoice
      description: |
        Returns `invoice_url`, a hosted checkout page. Send the customer there. The customer selects a coin, and
        Turmite creates a payment for the invoice. The payment copies `order_id`, `order_description`,
        `ipn_callback_url`, `success_url` and `cancel_url` from the invoice. Webhooks for that payment go to the
        invoice's `ipn_callback_url`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceRequest" }
            example:
              price_amount: 49.9
              price_currency: eur
              order_id: "1042"
              order_description: "Order #1042"
              ipn_callback_url: https://shop.example.com/turmite/ipn
              success_url: https://shop.example.com/checkout/order-received/1042
              cancel_url: https://shop.example.com/checkout
      responses:
        "201":
          description: The new invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
              example:
                id: "4522625843"
                token_id: k3J9xQ2vT8mZ5wR1nB7cY4pL
                order_id: "1042"
                order_description: "Order #1042"
                price_amount: "49.9"
                price_currency: eur
                pay_currency: null
                ipn_callback_url: https://shop.example.com/turmite/ipn
                invoice_url: https://pay.example.com/i/k3J9xQ2vT8mZ5wR1nB7cY4pL
                success_url: https://shop.example.com/checkout/order-received/1042
                cancel_url: https://shop.example.com/checkout
                created_at: "2026-10-23T12:00:00.000Z"
                updated_at: "2026-10-23T12:00:00.000Z"
                expiration_estimate_date: "2026-10-23T13:00:00.000Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoice-payment:
    post:
      tags: [Invoices]
      operationId: createInvoicePayment
      summary: Create a payment for an invoice
      description: |
        Use this to build your own coin selection for an invoice. The payment gets the invoice's price, order and
        URLs. If the invoice has an open payment in `pay_currency`, Turmite returns that payment. In this response
        `payment_id` and `purchase_id` are strings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoicePaymentRequest" }
            example:
              iid: "4522625843"
              pay_currency: usdttrc20
      responses:
        "201":
          description: The new payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedPayment" }
              examples:
                payment: { $ref: "#/components/examples/CreatedPayment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/balance:
    get:
      tags: [Reference]
      operationId: getBalance
      summary: Get the project balance per ticker
      responses:
        "200":
          description: One entry per ticker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
              example:
                btc: { amount: 0.0153, pendingAmount: 0.0012 }
                usdttrc20: { amount: 1250.5, pendingAmount: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/auth:
    post:
      tags: [Auth]
      operationId: auth
      summary: Get a bearer token for the payout endpoints
      description: Use the email and password of a dashboard user. The token is valid for 5 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRequest" }
            example: { email: ops@shop.example.com, password: correct-horse-battery-staple }
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
              example: { token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/payout:
    post:
      tags: [Payouts]
      operationId: createPayout
      summary: Create a payout batch
      description: |
        Creates one payout per withdrawal. The bearer token must belong to a project admin of the API key's
        project. Each address must be in the project's address book. New payouts are `pending-otp-verification`
        until you verify the batch with `POST /v1/payout/{batch_id}/verify`. A withdrawal with a
        `unique_external_id` that already exists returns the existing payout. The same id with other fields
        returns `409`. At most 100 withdrawals per batch. Bitcoin and Monero have no payouts.
      security:
        - apiKey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePayoutRequest" }
            example:
              withdrawals:
                - address: TQrZ9wBzhXnHdAdKwRBfdMH2RiTjH6yGtW
                  currency: usdttrc20
                  amount: "250.00"
                  ipn_callback_url: https://shop.example.com/turmite/payout-ipn
                  unique_external_id: refund-1042
      responses:
        "201":
          description: The new batch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutBatch" }
              examples:
                payoutBatch: { $ref: "#/components/examples/PayoutBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Payouts]
      operationId: listPayouts
      summary: List payouts
      security:
        - apiKey: []
          bearerAuth: []
      parameters:
        - name: batch_id
          in: query
          description: Only the payouts of this batch.
          schema: { type: string, pattern: "^[0-9]+$" }
        - name: status
          in: query
          description: Only the payouts with this status. An unknown status returns `400`.
          schema: { $ref: "#/components/schemas/PayoutStatus" }
        - name: date_from
          in: query
          description: Earliest `created_at`. A date or a date-time.
          schema: { type: string }
        - name: date_to
          in: query
          description: Latest `created_at`. A date or a date-time.
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: limit
          in: query
          description: Payouts per page. Turmite changes a value below 1 to 1 and a value above 500 to 500.
          schema: { type: integer, minimum: 1, maximum: 500, default: 10 }
        - name: page
          in: query
          description: Page number. The first page is 0.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of payouts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/payout/{batch_id}/verify:
    post:
      tags: [Payouts]
      operationId: verifyPayout
      summary: Verify a payout batch
      description: |
        Send the current TOTP code of the user who got the bearer token. That user must be a project admin. Each
        payout of the batch that waits for verification then goes through the project limits: within them it is
        `pending`; above the auto-approve amount or the hourly or daily limit it is `pending-approval` until an
        admin approves it in the dashboard. A wrong code returns `400`. After 5 wrong codes the user is locked for
        15 minutes and gets `429`. A user without two-factor authentication gets `403`.
      security:
        - apiKey: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyPayoutRequest" }
            example: { verification_code: "123456" }
      responses:
        "200":
          description: The batch after verification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/payout/{batch_id}:
    get:
      tags: [Payouts]
      operationId: getPayout
      summary: Get a payout batch
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: The batch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutBatch" }
              examples:
                payoutBatch: { $ref: "#/components/examples/PayoutBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/payout/validate-address:
    post:
      tags: [Payouts]
      operationId: validateAddress
      summary: Validate a payout address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateAddressRequest" }
            example: { address: TQrZ9wBzhXnHdAdKwRBfdMH2RiTjH6yGtW, currency: usdttrc20 }
      responses:
        "200":
          description: The address is valid. The body is the JSON string `"OK"`. An invalid address or an unknown currency returns `400`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidateAddressResponse" }
              example: OK
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/payout/fee:
    get:
      tags: [Payouts]
      operationId: getPayoutFee
      summary: Estimate the network fee of a payout
      description: |
        The fee is an estimate from the chain. Turmite measures the real fee when it sends the payout. The hot
        wallet pays the fee in the native coin of the network (`network_fee` in `fee_currency`); the recipient gets
        the full amount. `fee` is that cost in `currency`. A Solana token payout to a wallet without a token
        account also pays the rent of that account.
      parameters:
        - name: currency
          in: query
          required: true
          schema: { type: string }
          example: usdttrc20
        - name: amount
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
          example: "250"
      responses:
        "200":
          description: The estimated fee in `currency`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutFee" }
              example: { currency: usdttrc20, amount: "250", fee: 1.1, network_fee: 4.4, fee_currency: trx }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

webhooks:
  payment:
    post:
      operationId: paymentWebhook
      summary: A payment changed
      description: |
        Turmite sends the payment object to the `ipn_callback_url` of the payment, or of its invoice. It sends
        one on each status change, one for each new confirmation count while the payment is `confirming`, and one
        on each extra credit after `finished`. Ship the order only on `finished`. In this body `payment_id` is a
        number and `purchase_id` is a string.

        Check the signature before you use the body. The signature header (default `x-turmite-sig`) holds the hex
        HMAC-SHA512 of the key-sorted JSON body. The key is the project IPN secret. To get the key-sorted JSON from
        the raw body:

        1. Sort the members of each object by key. Compare keys as UTF-8 bytes. Keep the order of arrays.
        2. Write compact JSON with no whitespace.
        3. Copy each number exactly as it is in the raw body, for example `0.5` or `1e-6`.
        4. In strings, escape only `"`, `\` and control characters. Do not escape `/` or non-ASCII characters.

        `x-turmite-signature` holds `v1=` and the hex HMAC-SHA256 of `<x-turmite-timestamp>.<raw body>`, with the
        same secret. Refuse a timestamp more than 5 minutes from your clock. Use `x-turmite-delivery` to ignore a
        delivery that you already processed.

        A 2xx response acknowledges the delivery. Progress events get 3 attempts: now, after 10 s and after 60 s.
        Final events get attempts now and after 10 s, 1 m, 5 m, 30 m, 1 h, 2 h, 4 h, 8 h, 24 h and 48 h. Then the
        delivery is dead. You can retry it from the dashboard.
      security: []
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/TimestampHeader"
        - $ref: "#/components/parameters/SignatureV1Header"
        - $ref: "#/components/parameters/EventHeader"
        - $ref: "#/components/parameters/DeliveryHeader"
        - $ref: "#/components/parameters/UserAgentHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentWebhook" }
            examples:
              payment: { $ref: "#/components/examples/PaymentWebhook" }
      responses:
        "200":
          description: Any 2xx status acknowledges the delivery.
        "400":
          description: Any other status makes Turmite retry on the schedule.

  payout:
    post:
      operationId: payoutWebhook
      summary: A payout changed
      description: |
        Turmite sends the payout object to the `ipn_callback_url` of the withdrawal (or of its batch) on each status
        change, with the event `payout.<status>` in `x-turmite-event`. The key is the project IPN secret. The headers,
        signatures and retries are the same as for the payment webhook. `sent`, `failed`, `rejected` and `cancelled`
        are final events.
      security: []
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/TimestampHeader"
        - $ref: "#/components/parameters/SignatureV1Header"
        - $ref: "#/components/parameters/EventHeader"
        - $ref: "#/components/parameters/DeliveryHeader"
        - $ref: "#/components/parameters/UserAgentHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Payout" }
            examples:
              payout: { $ref: "#/components/examples/Payout" }
      responses:
        "200":
          description: Any 2xx status acknowledges the delivery.
        "400":
          description: Any other status makes Turmite retry on the schedule.

  event:
    post:
      operationId: endpointWebhook
      summary: An event for a project endpoint
      description: |
        Turmite sends this envelope to each endpoint that you add under Webhooks in the dashboard. `event` is
        `payment.<status>` with a payment in `data`, `payout.<status>` with a payout in `data`, or `test` with a
        message in `data`.

        Each endpoint has its own secret. The dashboard shows it. Turmite signs both signature headers with it.
        The headers, the signature rules and the retries are the same as for the payment webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/TimestampHeader"
        - $ref: "#/components/parameters/SignatureV1Header"
        - $ref: "#/components/parameters/EventHeader"
        - $ref: "#/components/parameters/DeliveryHeader"
        - $ref: "#/components/parameters/UserAgentHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEnvelope" }
            examples:
              paymentFinished: { $ref: "#/components/examples/EventPaymentFinished" }
              test: { $ref: "#/components/examples/EventTest" }
      responses:
        "200":
          description: Any 2xx status acknowledges the delivery.
        "400":
          description: Any other status makes Turmite retry on the schedule.

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: A project API key. Create it under API keys in the dashboard. Keys start with `tm_`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A token from `POST /v1/auth`. It is valid for 5 minutes.

  parameters:
    BatchId:
      name: batch_id
      in: path
      required: true
      description: The `id` of the payout batch.
      schema: { type: string }
      example: "5000000713"
    SignatureHeader:
      name: x-turmite-sig
      in: header
      required: true
      description: |
        Hex HMAC-SHA512 of the key-sorted JSON body. The key is the project IPN secret for an `ipn_callback_url`,
        or the endpoint secret for a project endpoint. The header name is a project setting. The default is `x-turmite-sig`.
      schema: { type: string, pattern: "^[0-9a-f]{128}$" }
    TimestampHeader:
      name: x-turmite-timestamp
      in: header
      required: true
      description: Unix time in seconds when Turmite signed this attempt.
      schema: { type: string, pattern: "^[0-9]+$" }
      example: "1761220800"
    SignatureV1Header:
      name: x-turmite-signature
      in: header
      required: true
      description: "`v1=` and the hex HMAC-SHA256 of `<x-turmite-timestamp>.<raw body>`. The key is the same as for the signature header."
      schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
    EventHeader:
      name: x-turmite-event
      in: header
      required: true
      description: The event name, such as `payment.finished`, `payout.sent` or `test`.
      schema: { type: string }
      example: payment.finished
    DeliveryHeader:
      name: x-turmite-delivery
      in: header
      required: true
      description: The delivery id. Retries of a delivery use the same id. Use it to ignore duplicates.
      schema: { type: string }
      example: dK4rT8wQ2mN6xP1vB9cL5zH7
    UserAgentHeader:
      name: user-agent
      in: header
      required: true
      schema: { type: string, const: turmite-webhook/1 }

  responses:
    BadRequest:
      description: The request is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, statusCode: 400, code: INVALID_REQUEST_PARAMS, message: "`price_amount` must be greater than 0." }
    Unauthorized:
      description: The API key or the bearer token is missing or not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, statusCode: 401, code: AUTH_REQUIRED, message: Invalid API key. }
    Forbidden:
      description: The key or the user cannot do this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, statusCode: 403, code: FORBIDDEN, message: Only a project admin can create or verify payouts. }
    NotFound:
      description: Not found, or it belongs to another project.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, statusCode: 404, code: NOT_FOUND, message: not found }
    Conflict:
      description: The request conflicts with an existing object.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, statusCode: 409, code: CONFLICT, message: "`unique_external_id` is used with other fields." }
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, statusCode: 429, code: TOO_MANY_REQUESTS, message: "too many requests, try again later" }
    InternalError:
      description: The server failed. The message has no details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, statusCode: 500, code: INTERNAL_ERROR, message: Internal error. }
    Unavailable:
      description: A service that the request needs is not available, for example the exchange rates. Try again later.
      headers:
        Retry-After:
          description: Seconds to wait before you try again. Not every `503` has it.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: false, statusCode: 503, code: UNAVAILABLE, message: Exchange rates are not available. Try again in a minute. }

