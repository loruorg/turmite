  schemas:
    Error:
      type: object
      required: [status, statusCode, code, message]
      properties:
        status:
          type: boolean
          const: false
        statusCode:
          type: integer
          description: The HTTP status.
        code:
          type: string
          examples: [INVALID_REQUEST_PARAMS, AUTH_REQUIRED, NOT_FOUND]
          description: |
            A stable error code. Known values: `INVALID_REQUEST_PARAMS` (400), `AUTH_REQUIRED` (401), `FORBIDDEN`
            (403), `NOT_FOUND` (404), `METHOD_NOT_ALLOWED` (405), `CONFLICT` (409), `TOO_MANY_REQUESTS` (429),
            `INTERNAL_ERROR` (500) and `UNAVAILABLE` (503). More values can come in later versions.
        message:
          type: string
      example: { status: false, statusCode: 400, code: INVALID_REQUEST_PARAMS, message: "Currency `xmr` is not enabled for this project. Add a Monero wallet in the dashboard." }

    Amount:
      description: A positive amount, as a JSON number or a decimal string.
      oneOf:
        - type: number
          exclusiveMinimum: 0
        - type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
      examples: [100, "0.00123"]

    DecimalString:
      type: string
      description: A decimal number as text.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      examples: ["250", "0.00123"]

    PaymentStatus:
      type: string
      enum: [waiting, confirming, confirmed, sending, partially_paid, finished, failed, refunded, expired]
      description: |
        `waiting`: no deposit yet. `confirming`: a deposit is on the chain with too few confirmations.
        `confirmed`: the deposit has enough confirmations. `sending`: Turmite moves the funds to the wallet of the
        project. `partially_paid`: the customer sent less than `pay_amount`. `finished`: paid in full. Ship the
        order now. `failed`, `refunded` and `expired` are final.

    PaymentFields:
      type: object
      description: |
        The fields that all payment objects share. Amounts are JSON numbers. A whole amount is an integer, such
        as `100`. In API responses a very small amount can have an exponent, such as `1e-6`. Webhook bodies write
        numbers as JavaScript does: `0.000001`, with an exponent only below 1e-7 (`1e-7`). Keep the raw body to
        check the signature.
      required:
        - invoice_id
        - payment_status
        - pay_address
        - payin_extra_id
        - price_amount
        - price_currency
        - pay_amount
        - actually_paid
        - pay_currency
        - order_id
        - order_description
        - outcome_amount
        - outcome_currency
        - network
        - network_precision
        - smart_contract
        - payin_hash
        - payout_hash
        - payment_url
        - created_at
        - updated_at
        - expiration_estimate_date
        - parent_payment_id
        - type
        - time_limit
        - burning_percent
        - payment_extra_ids
        - amount_received
        - actually_paid_at_fiat
        - fee
      properties:
        invoice_id: { type: [integer, "null"], format: int64 }
        payment_status: { $ref: "#/components/schemas/PaymentStatus" }
        pay_address: { type: string, description: The deposit address. }
        payin_extra_id:
          type: [string, "null"]
          description: The memo or tag the customer must add, on networks that use one.
        price_amount: { type: number, description: The price in `price_currency`. }
        price_currency: { type: string, description: Lowercase., examples: [usd] }
        pay_amount: { type: number, description: The amount to pay in `pay_currency`. }
        actually_paid: { type: number, description: The amount received so far. }
        pay_currency: { type: string, examples: [btc] }
        order_id: { type: [string, "null"] }
        order_description: { type: [string, "null"] }
        outcome_amount:
          type: [number, "null"]
          description: The amount credited to the project after network fees.
        outcome_currency: { type: string }
        network:
          type: string
          description: The network code. One of `btc`, `xmr`, `eth`, `base`, `polygon`, `bsc`, `tron`, `sol`, `ton`.
          examples: [btc]
        network_precision: { type: integer, description: The decimals of `pay_currency`. }
        smart_contract: { type: [string, "null"], description: The token contract. Null for a native coin. }
        payin_hash: { type: [string, "null"], description: The transaction hash of the latest deposit. }
        payout_hash:
          type: [string, "null"]
          description: The transaction hash of the latest transfer from the deposit address to the project wallet.
        payment_url:
          type: string
          format: uri
          description: The hosted payment page, `<site URL>/pay/<token>`. The token is random.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expiration_estimate_date:
          type: string
          format: date-time
          description: When the payment expires if no deposit comes.
        parent_payment_id: { type: "null", description: Always null. }
        type: { type: string, enum: [crypto2crypto], description: Always `crypto2crypto`. }
        time_limit: { type: "null", description: Always null. }
        burning_percent: { type: "null", description: Always null. }
        payment_extra_ids: { type: "null", description: Always null. }
        amount_received:
          type: number
          description: The amount the project gets in `outcome_currency`. `outcome_amount` once funds are credited, else `pay_amount`.
        actually_paid_at_fiat:
          type: number
          description: |
            `actually_paid` in `price_currency`, at the rate of the payment. A payment with a fixed `pay_amount`
            uses `price_amount / pay_amount` as the rate.
        fee:
          type: object
          description: Turmite takes no fee. `withdrawalFee` is the network fee of the sweeps to the project wallet.
          required: [currency, depositFee, withdrawalFee, serviceFee]
          properties:
            currency: { type: string, description: The same as `pay_currency`., examples: [btc] }
            depositFee: { type: number, description: Always 0. }
            withdrawalFee: { type: number }
            serviceFee: { type: number, description: Always 0. }

    Payment:
      description: A payment as `GET /v1/payment/{payment_id}` and `GET /v1/payment` return it.
      allOf:
        - $ref: "#/components/schemas/PaymentFields"
        - type: object
          required: [payment_id, purchase_id]
          properties:
            payment_id: { type: integer, format: int64 }
            purchase_id:
              type: [integer, string]
              description: |
                The `purchase_id` of the request, or numeric text that Turmite makes. A plain decimal integer up
                to 2^53 - 1 is a JSON number. Other values are strings.
              examples: [6084815412]

    CreatedPayment:
      description: A payment as `POST /v1/payment` and `POST /v1/invoice-payment` return it.
      allOf:
        - $ref: "#/components/schemas/PaymentFields"
        - type: object
          required: [payment_id, purchase_id]
          properties:
            payment_id:
              type: string
              pattern: "^[0-9]+$"
              description: The payment id as numeric text.
              examples: ["5077125051"]
            purchase_id:
              type: string
              description: The `purchase_id` of the request, or numeric text that Turmite makes.
              examples: ["6084815412"]

    PaymentWebhook:
      description: A payment as webhooks send it.
      allOf:
        - $ref: "#/components/schemas/PaymentFields"
        - type: object
          required: [payment_id, purchase_id]
          properties:
            payment_id: { type: integer, format: int64 }
            purchase_id:
              type: string
              description: The `purchase_id` of the request, or numeric text that Turmite makes.
              examples: ["6084815412"]

    PaymentList:
      type: object
      required: [data, limit, page, pagesCount, total]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        limit: { type: integer }
        page: { type: integer }
        pagesCount: { type: integer }
        total: { type: integer }

    CreatePaymentRequest:
      type: object
      required: [price_amount, price_currency, pay_currency]
      properties:
        price_amount: { $ref: "#/components/schemas/Amount" }
        price_currency:
          type: string
          maxLength: 12
          description: A fiat code or a ticker.
          examples: [usd]
        pay_currency:
          type: string
          description: The ticker the customer pays with.
          examples: [btc]
        pay_amount:
          $ref: "#/components/schemas/Amount"
          description: A fixed amount in `pay_currency`. Without it, Turmite converts `price_amount` at the current rate.
        order_id: { type: string, maxLength: 255, description: Your order reference. Webhooks include it. }
        order_description: { type: string, maxLength: 1000 }
        ipn_callback_url:
          type: string
          format: uri
          description: Turmite sends payment webhooks to this URL. On mainnet it must be a public `https` URL.
        success_url: { type: string, format: uri, description: Where the checkout sends the customer after payment. }
        cancel_url: { type: string, format: uri }
        purchase_id:
          type: string
          maxLength: 255
          description: Your id for the purchase. Without it, Turmite makes numeric text.
        idempotency_key:
          type: string
          maxLength: 255
          description: |
            A request with a key that the project used before returns the first payment. This is also true for two
            requests at the same time. Turmite does not compare the other fields.

    Invoice:
      type: object
      required:
        - id
        - token_id
        - order_id
        - order_description
        - price_amount
        - price_currency
        - pay_currency
        - ipn_callback_url
        - invoice_url
        - success_url
        - cancel_url
        - created_at
        - updated_at
        - expiration_estimate_date
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
          description: The invoice id as numeric text. Use it as `iid` in `POST /v1/invoice-payment`.
          examples: ["4522625843"]
        token_id: { type: string, description: The random token in `invoice_url`. }
        order_id: { type: [string, "null"] }
        order_description: { type: [string, "null"] }
        price_amount: { $ref: "#/components/schemas/DecimalString" }
        price_currency: { type: string, description: Lowercase., examples: [eur] }
        pay_currency: { type: [string, "null"] }
        ipn_callback_url: { type: [string, "null"], format: uri }
        invoice_url:
          type: string
          format: uri
          description: The hosted checkout page, `<site URL>/i/<token_id>`.
        success_url: { type: [string, "null"], format: uri }
        cancel_url: { type: [string, "null"], format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expiration_estimate_date:
          type: string
          format: date-time
          description: When the invoice expires.

    CreateInvoiceRequest:
      type: object
      required: [price_amount, price_currency]
      properties:
        price_amount: { $ref: "#/components/schemas/Amount" }
        price_currency: { type: string, examples: [eur] }
        pay_currency:
          type: string
          description: Set it to skip the coin selection on the invoice page.
        order_id: { type: string }
        order_description: { type: string }
        ipn_callback_url:
          type: string
          format: uri
          description: Turmite sends the webhooks of the invoice's payments to this URL.
        success_url: { type: string, format: uri }
        cancel_url: { type: string, format: uri }

    CreateInvoicePaymentRequest:
      type: object
      required: [iid, pay_currency]
      properties:
        iid:
          description: The invoice `id`.
          oneOf:
            - type: integer
              format: int64
            - type: string
              pattern: "^[0-9]+$"
        pay_currency: { type: string, examples: [usdttrc20] }
        purchase_id: { type: string, maxLength: 255 }

    FullCurrency:
      type: object
      required:
        - id
        - code
        - name
        - enable
        - wallet_regex
        - priority
        - extra_id_exists
        - extra_id_regex
        - logo_url
        - track
        - cg_id
        - is_maxlimit
        - network
        - smart_contract
        - network_precision
        - ticker
      properties:
        id: { type: integer }
        code: { type: string, description: The ticker in upper case., examples: [USDTTRC20] }
        name: { type: string, examples: [Tether USD] }
        enable:
          type: boolean
          description: True when the key's project takes this ticker. Without a key, true when at least one project takes it.
        wallet_regex: { type: "null", description: Always null. }
        priority: { type: integer, description: The sort order. }
        extra_id_exists: { type: boolean, description: True when payments on this network use a memo. }
        extra_id_regex: { type: "null", description: Always null. }
        logo_url: { type: "null", description: Always null. }
        track: { type: boolean, const: false }
        cg_id: { type: [string, "null"], description: The rate source id of the asset. }
        is_maxlimit: { type: boolean, const: false }
        network: { type: string, description: The network code in lower case., examples: [tron] }
        smart_contract: { type: [string, "null"], description: The token contract. Null for a native coin. }
        network_precision: { type: string, pattern: "^[0-9]+$", description: The decimals of the asset as numeric text., examples: ["6"] }
        ticker: { type: string, description: The value for `pay_currency`., examples: [usdttrc20] }

    Balance:
      type: object
      description: One entry per ticker.
      additionalProperties:
        type: object
        required: [amount, pendingAmount]
        properties:
          amount: { type: number }
          pendingAmount: { type: number }

    MinAmountResponse:
      type: object
      required: [currency_from, currency_to, min_amount]
      properties:
        currency_from: { type: string, description: The ticker. }
        currency_to: { type: string }
        min_amount: { type: number, description: The smallest payment in `currency_from`. }
        fiat_equivalent:
          type: number
          description: "`min_amount` in the fiat currency of the request. Only when the request has `fiat_equivalent` and a rate is available."

    EstimateResponse:
      type: object
      required: [currency_from, amount_from, currency_to, estimated_amount]
      properties:
        currency_from: { type: string }
        amount_from: { type: number }
        currency_to: { type: string }
        estimated_amount:
          $ref: "#/components/schemas/DecimalString"
          description: The amount in `currency_to`, as a decimal string.

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthResponse:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "A JWT. Send it as `Authorization: Bearer <token>`." }

    PayoutStatus:
      type: string
      enum: [pending-approval, pending-otp-verification, pending, signing, initiated, sent, failed, rejected, cancelled, needs-review]
      description: |
        `pending-otp-verification`: waits for a one-time code. An API batch waits for `verify`, or the admin who
        clicked Approve in the dashboard must enter the code that Turmite emailed. `pending-approval`: above a
        project limit; waits for an admin in the dashboard. `pending`: cleared to send. `signing`: signed and
        stored, no node took it yet. `initiated`: a node took the transaction. `sent`: on the chain with the
        network's confirmations. `sent`, `failed`, `rejected` and `cancelled` are final. `needs-review`: Turmite
        cannot tell whether the payout went out (its nonce is used by another transaction). An admin checks the
        chain and records the result.

    Payout:
      type: object
      required:
        - id
        - batch_withdrawal_id
        - address
        - extra_id
        - currency
        - network
        - amount
        - fee
        - fee_currency
        - status
        - hash
        - error
        - ipn_callback_url
        - payout_description
        - unique_external_id
        - created_at
        - requested_at
        - updated_at
      properties:
        id: { type: string }
        batch_withdrawal_id: { type: string }
        address: { type: string }
        extra_id: { type: [string, "null"] }
        currency: { type: string }
        network: { type: string, description: "The network code in lower case, such as `eth` or `tron`." }
        amount: { $ref: "#/components/schemas/DecimalString" }
        fee:
          type: [string, "null"]
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: The network fee in `fee_currency`, when known. The hot wallet pays it.
        fee_currency: { type: string, description: "The native coin of the network, such as `eth` or `trx`." }
        status: { $ref: "#/components/schemas/PayoutStatus" }
        hash: { type: [string, "null"], description: The transaction hash. }
        error: { type: [string, "null"] }
        ipn_callback_url: { type: [string, "null"], format: uri }
        payout_description: { type: [string, "null"] }
        unique_external_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        requested_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    PayoutBatch:
      type: object
      required: [id, withdrawals]
      properties:
        id: { type: string }
        withdrawals:
          type: array
          items: { $ref: "#/components/schemas/Payout" }

    PayoutList:
      type: object
      required: [payouts, limit, page, pagesCount, total]
      properties:
        payouts:
          type: array
          items: { $ref: "#/components/schemas/Payout" }
        limit: { type: integer }
        page: { type: integer }
        pagesCount: { type: integer }
        total: { type: integer }

    Withdrawal:
      type: object
      required: [address, currency, amount]
      properties:
        address:
          type: string
          description: The destination. It must be in the project's address book.
        currency: { type: string, examples: [usdttrc20] }
        amount: { $ref: "#/components/schemas/Amount" }
        extra_id: { type: string, description: The memo or tag of the destination. }
        ipn_callback_url:
          type: string
          format: uri
          description: Turmite sends payout webhooks to this URL. Without it, the batch's `ipn_callback_url` is used.
        payout_description: { type: string }
        unique_external_id:
          type: string
          description: |
            Your id for this payout. A second request with the same id and fields returns the existing payout.
            The same id with other fields returns `409`.

    CreatePayoutRequest:
      type: object
      required: [withdrawals]
      properties:
        withdrawals:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Withdrawal" }
        ipn_callback_url:
          type: string
          format: uri
          description: Payout webhooks for each withdrawal without its own `ipn_callback_url`.

    VerifyPayoutRequest:
      type: object
      required: [verification_code]
      properties:
        verification_code:
          type: string
          pattern: "^[0-9]{6}$"
          description: The current TOTP code of the dashboard user.

    ValidateAddressRequest:
      type: object
      required: [address, currency]
      properties:
        address: { type: string }
        currency: { type: string }

    ValidateAddressResponse:
      type: string
      const: OK

    PayoutFee:
      type: object
      required: [currency, amount, fee, network_fee, fee_currency]
      properties:
        currency: { type: string }
        amount: { type: [string, "null"], description: The `amount` of the request. }
        fee: { type: number, description: "The network fee, in `currency`." }
        network_fee: { type: number, description: "The network fee in `fee_currency`." }
        fee_currency: { type: string, description: The native coin that pays the fee. }

    WebhookEnvelope:
      type: object
      required: [event, delivery_id, created_at, data]
      properties:
        event:
          type: string
          description: "`payment.<status>`, `payout.<status>` or `test`."
          examples: [payment.finished]
        delivery_id:
          type: string
          description: The same value as the `x-turmite-delivery` header.
        created_at:
          type: integer
          format: int64
          description: Unix time in seconds when Turmite made the event.
        data:
          oneOf:
            - $ref: "#/components/schemas/PaymentWebhook"
            - $ref: "#/components/schemas/Payout"
            - $ref: "#/components/schemas/TestEventData"

    TestEventData:
      type: object
      description: The `data` of a `test` event.
      required: [message]
      properties:
        message:
          type: string
          examples: [Test event from Turmite.]
